name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

env:
  PROJECT_NAME: 'Classin视频解析下载工具'
  FILE_VERSION: '0.7.0'
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rid: win-x64
            os_name: Windows
            arch: x64
          - platform: windows-latest
            rid: win-x86
            os_name: Windows
            arch: x86
          - platform: windows-latest
            rid: win-arm64
            os_name: Windows
            arch: arm64
          - platform: ubuntu-22.04
            rid: linux-x64
            os_name: Linux
            arch: x64
          - platform: ubuntu-22.04-arm
            rid: linux-arm64
            os_name: Linux
            arch: arm64
          - platform: macos-latest
            rid: osx-x64
            os_name: macOS
            arch: x64
          - platform: macos-latest
            rid: osx-arm64
            os_name: macOS
            arch: arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved: TAG=${TAG} VERSION=${VERSION}"

      - name: Build
        run: dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          NAME="${{ env.PROJECT_NAME }}_${{ env.FILE_VERSION }}_${{ matrix.os_name }}_${{ matrix.arch }}"
          PUBLISH_DIR="bin/Release/net8.0/${{ matrix.rid }}/publish"

          if [ -f "$PUBLISH_DIR/Classin视频解析下载工具.exe" ]; then
            cp "$PUBLISH_DIR/Classin视频解析下载工具.exe" "artifacts/${NAME}.exe"
          elif [ -f "$PUBLISH_DIR/Classin视频解析下载工具" ]; then
            cp "$PUBLISH_DIR/Classin视频解析下载工具" "artifacts/${NAME}"
          fi

          # Portable zip (include publish dir contents) - use 7z (available on all runners)
          if [ -d "$PUBLISH_DIR" ]; then
            (cd "$PUBLISH_DIR" && 7z a "$GITHUB_WORKSPACE/artifacts/${NAME}_portable.zip" .) || true
          fi

          echo "=== Collected artifacts ==="
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os_name }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: warn

  release:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release_files
          find artifacts -type f | while read f; do
            cp "$f" release_files/
          done
          ls -la release_files/

      - name: Generate SHA256 checksums
        run: |
          cd release_files
          sha256sum * | sort -k2 > ../SHA256SUMS.txt
          cd ..
          cat SHA256SUMS.txt

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          FILE_VERSION="${{ env.FILE_VERSION }}"
          DATE=$(date -u +%Y-%m-%d)
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"
          PROJECT_NAME="${{ env.PROJECT_NAME }}"
          
          cat > notes.md << 'NOTES_EOF'
          ## ${PROJECT_NAME} ${TAG}

          **发布日期**: ${DATE}

          ---

          ### 新增功能

          - Avalonia UI 图形化版本（.NET 8）
          - 启动画面（Splash Screen）优化
          - URL 安全验证（SSRF 防护、域名白名单）
          - 异步日志服务（高性能文件写入）
          - 异步确认对话框
          - 配置保存重试机制
          - 内存监控服务优化
          - 进度变化检测 BUG 修复
          - 课程名称乱码问题修复

          ### 下载说明

          | 平台 | 架构 | 文件 | 说明 |
          |------|------|------|------|
          | Linux | arm64 | [`${PROJECT_NAME}_${FILE_VERSION}_Linux_arm64.AppImage`](${BASE_URL}/${PROJECT_NAME}_${FILE_VERSION}_Linux_arm64.AppImage) | 通用应用 |
          | Linux | arm64 | [`${PROJECT_NAME}_${FILE_VERSION}_Linux_arm64.deb`](${BASE_URL}/${PROJECT_NAME}_${FILE_VERSION}_Linux_arm64.deb) | Debian/Ubuntu |
          | Linux | arm64 | [`${PROJECT_NAME}_${FILE_VERSION}_Linux_arm64.tar.gz`](${BASE_URL}/${PROJECT_NAME}_${FILE_VERSION}_Linux_arm64.tar.gz) | 便携版 |
          | Linux | x64 | [`${PROJECT_NAME}_${FILE_VERSION}_Linux_x64.AppImage`](${BASE_URL}/${PROJECT_NAME}_${FILE_VERSION}_Linux_x64.AppImage) | 通用应用 |
          | Linux | x64 | [`${PROJECT_NAME}_${FILE_VERSION}_Linux_x64.deb`](${BASE_URL}/${PROJECT_NAME}_${FILE_VERSION}_Linux_x64.deb) | Debian/Ubuntu |
          | Linux | x64 | [`${PROJECT_NAME}_${FILE_VERSION}_Linux_x64.tar.gz`](${BASE_URL}/${PROJECT_NAME}_${FILE_VERSION}_Linux_x64.tar.gz) | 便携版 |
          | Windows | arm64 | [`${PROJECT_NAME}_${FILE_VERSION}_Windows_arm64.exe`](${BASE_URL}/${PROJECT_NAME}_${FILE_VERSION}_Windows_arm64.exe) | NSIS 安装程序 |
          | Windows | arm64 | [`${PROJECT_NAME}_${FILE_VERSION}_Windows_arm64.msi`](${BASE_URL}/${PROJECT_NAME}_${FILE_VERSION}_Windows_arm64.msi) | MSI 安装程序 |
          | Windows | arm64 | [`${PROJECT_NAME}_${FILE_VERSION}_Windows_arm64.zip`](${BASE_URL}/${PROJECT_NAME}_${FILE_VERSION}_Windows_arm64.zip) | 便携版 |
          | Windows | x64 | [`${PROJECT_NAME}_${FILE_VERSION}_Windows_x64.exe`](${BASE_URL}/${PROJECT_NAME}_${FILE_VERSION}_Windows_x64.exe) | NSIS 安装程序 |
          | Windows | x64 | [`${PROJECT_NAME}_${FILE_VERSION}_Windows_x64.msi`](${BASE_URL}/${PROJECT_NAME}_${FILE_VERSION}_Windows_x64.msi) | MSI 安装程序 |
          | Windows | x64 | [`${PROJECT_NAME}_${FILE_VERSION}_Windows_x64.zip`](${BASE_URL}/${PROJECT_NAME}_${FILE_VERSION}_Windows_x64.zip) | 便携版 |
          | Windows | x86 | [`${PROJECT_NAME}_${FILE_VERSION}_Windows_x86.exe`](${BASE_URL}/${PROJECT_NAME}_${FILE_VERSION}_Windows_x86.exe) | NSIS 安装程序 |
          | Windows | x86 | [`${PROJECT_NAME}_${FILE_VERSION}_Windows_x86.msi`](${BASE_URL}/${PROJECT_NAME}_${FILE_VERSION}_Windows_x86.msi) | MSI 安装程序 |
          | Windows | x86 | [`${PROJECT_NAME}_${FILE_VERSION}_Windows_x86.zip`](${BASE_URL}/${PROJECT_NAME}_${FILE_VERSION}_Windows_x86.zip) | 便携版 |
          | macOS | arm64 | [`${PROJECT_NAME}_${FILE_VERSION}_macOS_arm64.dmg`](${BASE_URL}/${PROJECT_NAME}_${FILE_VERSION}_macOS_arm64.dmg) | 磁盘映像 |
          | macOS | arm64 | [`${PROJECT_NAME}_${FILE_VERSION}_macOS_arm64.tar.gz`](${BASE_URL}/${PROJECT_NAME}_${FILE_VERSION}_macOS_arm64.tar.gz) | 便携版 |
          | macOS | x64 | [`${PROJECT_NAME}_${FILE_VERSION}_macOS_x64.dmg`](${BASE_URL}/${PROJECT_NAME}_${FILE_VERSION}_macOS_x64.dmg) | 磁盘映像 |
          | macOS | x64 | [`${PROJECT_NAME}_${FILE_VERSION}_macOS_x64.tar.gz`](${BASE_URL}/${PROJECT_NAME}_${FILE_VERSION}_macOS_x64.tar.gz) | 便携版 |

          ### 哈希校验

          <details>
          <summary>展开查看 SHA256 校验和</summary>

          ```
          ${SHA256_SUMS}
          ```

          **校验方法**：
          - Windows: `Get-FileHash <文件名> -Algorithm SHA256`
          - Linux/macOS: `sha256sum <文件名>`

          </details>

          ---

          **完整变更日志**: [CHANGELOG.md](https://github.com/${REPO}/blob/main/CHANGELOG.md)
          NOTES_EOF
          
          SHA256_SUMS=$(cat SHA256SUMS.txt)
          sed -i "s|SHA256_SUMS|${SHA256_SUMS}|g" notes.md
          
          echo "body<<EOF"
          cat notes.md
          echo "EOF"


      - name: Delete existing release (if any)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ env.PROJECT_NAME }} ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          body: ${{ steps.notes.outputs.body }}
          files: |
            release_files/*
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
