name: Release

# 触发条件
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.2)'
        required: true
        type: string

# 权限
permissions:
  contents: write

# 并发控制
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

# 全局变量
env:
  PROJECT_NAME: 'ClassInDL'
  DOTNET_VERSION: '8.0.x'

jobs:
  precheck:
    name: Pre-release audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Check .csproj Version consistency
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          CSPROJ_VERSION=$(grep -oP '(?<=<Version>)[^<]+' *.csproj | head -1)
          echo "tag: $VERSION"
          echo "csproj: $CSPROJ_VERSION"
          if [ "$VERSION" != "$CSPROJ_VERSION" ]; then
            echo "Version mismatch, run scripts/release.ps1 first"
            exit 1
          fi

  build:
    name: Build (${{ matrix.os_name }} ${{ matrix.arch }})
    needs: precheck
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rid: win-x64
            os_name: Windows
            arch: x64
          - platform: windows-latest
            rid: win-x86
            os_name: Windows
            arch: x86
          - platform: windows-latest
            rid: win-arm64
            os_name: Windows
            arch: arm64
          - platform: ubuntu-22.04
            rid: linux-x64
            os_name: Linux
            arch: x64
          - platform: ubuntu-22.04-arm
            rid: linux-arm64
            os_name: Linux
            arch: arm64
          - platform: macos-latest
            rid: osx-x64
            os_name: macOS
            arch: x64
          - platform: macos-latest
            rid: osx-arm64
            os_name: macOS
            arch: arm64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true
      - name: Package
        shell: bash
        run: |
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#v}
          BASE=${{ env.PROJECT_NAME }}_${VERSION}_${{ matrix.os_name }}_${{ matrix.arch }}
          PUBLISH_DIR=bin/Release/net8.0/${{ matrix.rid }}/publish
          mkdir -p release_files
          if [ "${{ matrix.os_name }}" = "Windows" ]; then
            if [ -f "$PUBLISH_DIR/Classin视频解析下载工具.exe" ]; then
              cp "$PUBLISH_DIR/Classin视频解析下载工具.exe" "release_files/${BASE}.exe"
            fi
            (cd "$PUBLISH_DIR" && 7z a "$GITHUB_WORKSPACE/release_files/${BASE}.zip" .) || true
          fi
          if [ "${{ matrix.os_name }}" = "Linux" ]; then
            (cd "$PUBLISH_DIR" && tar czf "$GITHUB_WORKSPACE/release_files/${BASE}.tar.gz" .) || true
          fi
          if [ "${{ matrix.os_name }}" = "macOS" ]; then
            (cd "$PUBLISH_DIR" && tar czf "$GITHUB_WORKSPACE/release_files/${BASE}.tar.gz" .) || true
          fi
          ls -la release_files/ || true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os_name }}-${{ matrix.arch }}
          path: release_files/*
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: build
    if: always() && needs.build.result != 'cancelled' && needs.build.result != 'failed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Prepare release files
        run: |
          mkdir -p release_files
          find artifacts -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.tar.gz" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.msi" \) -exec cp {} release_files/ \;
          ls -la release_files/
      - name: Generate SHA256SUMS
        working-directory: release_files
        run: sha256sum * | tee ../SHA256SUMS.txt
      - name: Generate release notes
        id: notes
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
        run: |
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"
          DATE=$(date -u +'%Y-%m-%d')
          cat > /tmp/release-notes.md <<HEADER
          # ClassIn视频下载工具 ${TAG}
          发布日期：${DATE}

          ## 新增功能
          - 统一发行规范，资产命名标准化为 \`${PROJECT_NAME}_<ver>_<OS>_<arch>.<ext>\` 格式
          - 标准化 Release Notes 模板
          - SHA256SUMS 校验文件自动生成

          ## 改进
          - 移除 update-readme.yml 工作流，README 下载表格改为手动维护
          - 重写 AI-WORKFLOW.md，固化统一发行规范

          ## 修复
          - 修正历史版本命名混乱问题（CHANGELOG 历史归档段）

          ## 依赖与安全
          - 升级工作流 Action 至 v4
          - 使用 SHA256SUMS 提供产物完整性校验

          ## 下载

          | 平台 | 架构 | 文件 | 说明 |
          |------|------|------|------|
          HEADER
          cd release_files
          declare -A PLATFORM_CN=(["Windows"]="Windows" ["Linux"]="Linux" ["macOS"]="macOS")
          declare -A ARCH_CN=(["x64"]="x64" ["x86"]="x86" ["arm64"]="arm64")
          declare -A EXTN_CN=(["exe"]="NSIS 安装程序" ["msi"]="MSI 安装程序" ["zip"]="便携版" ["deb"]="Debian/Ubuntu" ["AppImage"]="通用应用" ["tar.gz"]="便携版" ["dmg"]="磁盘映像")
          for f in $(ls | sort); do
            base="${f%.*}"
            if [[ "$f" == *.tar.gz ]]; then ext="tar.gz"; base="${f%.tar.gz}"
            elif [[ "$f" == *.AppImage ]]; then ext="AppImage"; base="${f%.AppImage}"
            elif [[ "$f" == *.exe ]]; then ext="exe"; base="${f%.exe}"
            elif [[ "$f" == *.msi ]]; then ext="msi"; base="${f%.msi}"
            elif [[ "$f" == *.zip ]]; then ext="zip"; base="${f%.zip}"
            elif [[ "$f" == *.deb ]]; then ext="deb"; base="${f%.deb}"
            elif [[ "$f" == *.dmg ]]; then ext="dmg"; base="${f%.dmg}"
            else continue; fi
            rest="${base#${PROJECT_NAME}_${VERSION}_}"
            arch="${rest##*_}"
            os="${rest%_*}"
            platform_cn="${PLATFORM_CN[$os]:-$os}"
            arch_cn="${ARCH_CN[$arch]:-$arch}"
            ext_cn="${EXTN_CN[$ext]:-$ext}"
            echo "| ${platform_cn} | ${arch_cn} | [${f}](${BASE_URL}/${f}) | ${ext_cn} |" >> /tmp/release-notes.md
          done
          cat >> /tmp/release-notes.md <<FOOTER

          ## 哈希校验

          <details>
          <summary>展开查看 SHA256 校验和</summary>

          \`\`\`
          $(cat ../SHA256SUMS.txt)
          \`\`\`

          **校验方法**：
          - Windows: \`Get-FileHash <文件名> -Algorithm SHA256\`
          - Linux/macOS: \`sha256sum <文件名>\`

          </details>

          ---

          **完整变更日志**: [CHANGELOG.md](https://github.com/${REPO}/blob/${TAG}/CHANGELOG.md)
          FOOTER
          {
            echo "body<<EOF"
            cat /tmp/release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Delete existing release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || echo "No existing release to delete"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ClassIn视频下载工具 ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          body: ${{ steps.notes.outputs.body }}
          files: |
            release_files/*
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

