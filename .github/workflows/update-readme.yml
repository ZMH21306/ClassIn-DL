name: Update README with latest release links (每分钟检查)

on:
  schedule:
    - cron: '* * * * *'   # 每分钟执行一次
  workflow_dispatch:       # 允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 获取最新 release 的标签名
      - name: Get latest release tag from GitHub API
        id: latest
        run: |
          LATEST_TAG=$(curl -sL -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name')
          if [ "$LATEST_TAG" = "null" ] || [ -z "$LATEST_TAG" ]; then
            echo "tag=" >> $GITHUB_OUTPUT
          else
            echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          fi

      # 检查是否已有新 release（通过比对 .latest_release 文件）
      - name: Check if README already up-to-date
        id: check
        run: |
          LATEST_TAG="${{ steps.latest.outputs.tag }}"
          if [ -z "$LATEST_TAG" ]; then
            echo "updated=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ -f .latest_release ]; then
            LAST_TAG=$(cat .latest_release)
          else
            LAST_TAG=""
          fi
          if [ "$LATEST_TAG" = "$LAST_TAG" ]; then
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "new_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          fi

      # 从完整标签中提取纯版本号（去除最后一个 - 及其之后的内容）
      - name: Extract version from tag
        if: steps.check.outputs.updated == 'true'
        id: vars
        run: |
          FULL_TAG="${{ steps.check.outputs.new_tag }}"
          VERSION="${FULL_TAG%-*}"   # 通用提取：删除最后一个 '-' 及其右侧所有字符
          echo "FULL_TAG=$FULL_TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # ===== 基于表格内容匹配的通用更新步骤 =====
      - name: Update download links in README (table-based)
        if: steps.check.outputs.updated == 'true'
        run: |
          NEW_TAG="${{ steps.check.outputs.new_tag }}"
          NEW_VER="${{ steps.vars.outputs.VERSION }}"

          # Windows x86_64
          sed -i "/| Windows | x86_64 |/ s|https://github.com/ZMH21306/ClassIn-DL/releases/download/[^/]*/Classin_DL-[^-]*-Windows-x64\.exe|https://github.com/ZMH21306/ClassIn-DL/releases/download/${NEW_TAG}/Classin_DL-${NEW_VER}-Windows-x64.exe|g" README.md
          sed -i "/| Windows | x86_64 |/ s|https://gh-proxy.org/https://github.com/ZMH21306/ClassIn-DL/releases/download/[^/]*/Classin_DL-[^-]*-Windows-x64\.exe|https://gh-proxy.org/https://github.com/ZMH21306/ClassIn-DL/releases/download/${NEW_TAG}/Classin_DL-${NEW_VER}-Windows-x64.exe|g" README.md

          # Windows arm64
          sed -i "/| Windows | arm64 |/ s|https://github.com/ZMH21306/ClassIn-DL/releases/download/[^/]*/Classin_DL-[^-]*-Windows-arm64\.exe|https://github.com/ZMH21306/ClassIn-DL/releases/download/${NEW_TAG}/Classin_DL-${NEW_VER}-Windows-arm64.exe|g" README.md
          sed -i "/| Windows | arm64 |/ s|https://gh-proxy.org/https://github.com/ZMH21306/ClassIn-DL/releases/download/[^/]*/Classin_DL-[^-]*-Windows-arm64\.exe|https://gh-proxy.org/https://github.com/ZMH21306/ClassIn-DL/releases/download/${NEW_TAG}/Classin_DL-${NEW_VER}-Windows-arm64.exe|g" README.md

          # Linux x86_64（无扩展名）
          sed -i "/| Linux | x86_64 |/ s|https://github.com/ZMH21306/ClassIn-DL/releases/download/[^/]*/Classin_DL-[^-]*-Linux-x64|https://github.com/ZMH21306/ClassIn-DL/releases/download/${NEW_TAG}/Classin_DL-${NEW_VER}-Linux-x64|g" README.md
          sed -i "/| Linux | x86_64 |/ s|https://gh-proxy.org/https://github.com/ZMH21306/ClassIn-DL/releases/download/[^/]*/Classin_DL-[^-]*-Linux-x64|https://gh-proxy.org/https://github.com/ZMH21306/ClassIn-DL/releases/download/${NEW_TAG}/Classin_DL-${NEW_VER}-Linux-x64|g" README.md

          # Linux arm64
          sed -i "/| Linux | arm64 |/ s|https://github.com/ZMH21306/ClassIn-DL/releases/download/[^/]*/Classin_DL-[^-]*-Linux-arm64|https://github.com/ZMH21306/ClassIn-DL/releases/download/${NEW_TAG}/Classin_DL-${NEW_VER}-Linux-arm64|g" README.md
          sed -i "/| Linux | arm64 |/ s|https://gh-proxy.org/https://github.com/ZMH21306/ClassIn-DL/releases/download/[^/]*/Classin_DL-[^-]*-Linux-arm64|https://gh-proxy.org/https://github.com/ZMH21306/ClassIn-DL/releases/download/${NEW_TAG}/Classin_DL-${NEW_VER}-Linux-arm64|g" README.md

          # macOS x86_64
          sed -i "/| macOS | x86_64 |/ s|https://github.com/ZMH21306/ClassIn-DL/releases/download/[^/]*/Classin_DL-[^-]*-macOS-x64|https://github.com/ZMH21306/ClassIn-DL/releases/download/${NEW_TAG}/Classin_DL-${NEW_VER}-macOS-x64|g" README.md
          sed -i "/| macOS | x86_64 |/ s|https://gh-proxy.org/https://github.com/ZMH21306/ClassIn-DL/releases/download/[^/]*/Classin_DL-[^-]*-macOS-x64|https://gh-proxy.org/https://github.com/ZMH21306/ClassIn-DL/releases/download/${NEW_TAG}/Classin_DL-${NEW_VER}-macOS-x64|g" README.md

          # macOS arm64
          sed -i "/| macOS | arm64 |/ s|https://github.com/ZMH21306/ClassIn-DL/releases/download/[^/]*/Classin_DL-[^-]*-macOS-arm64|https://github.com/ZMH21306/ClassIn-DL/releases/download/${NEW_TAG}/Classin_DL-${NEW_VER}-macOS-arm64|g" README.md
          sed -i "/| macOS | arm64 |/ s|https://gh-proxy.org/https://github.com/ZMH21306/ClassIn-DL/releases/download/[^/]*/Classin_DL-[^-]*-macOS-arm64|https://gh-proxy.org/https://github.com/ZMH21306/ClassIn-DL/releases/download/${NEW_TAG}/Classin_DL-${NEW_VER}-macOS-arm64|g" README.md

      # 将最新标签写入文件，供下次比较
      - name: Save latest tag to file
        if: steps.check.outputs.updated == 'true'
        run: |
          echo "${{ steps.check.outputs.new_tag }}" > .latest_release

      # 提交并推送更改
      - name: Commit and push changes
        if: steps.check.outputs.updated == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md .latest_release
          git commit -m "Update download links to ${{ steps.check.outputs.new_tag }}"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push
