name: Update Download Links

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update download links in README
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // 获取最新 release 信息
            const { data: latest } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const version = latest.tag_name;
            const assets = latest.assets;
            console.log(`最新版本: ${version}, 包含 ${assets.length} 个文件`);

            // 读取 README.md
            const readmePath = path.join(process.env.GITHUB_WORKSPACE, 'README.md');
            let content = fs.readFileSync(readmePath, 'utf8');

            // 定位下载表格区域（从 "## 下载" 到下一个二级标题或文件末尾）
            const tableRegex = /(## 下载\n\n.*?)\n(## |$)/s;
            const match = content.match(tableRegex);
            if (!match) {
              console.log('未找到下载表格区域');
              return;
            }
            const oldTable = match[1];
            const lines = oldTable.split('\n');
            const newLines = [];

            // 辅助函数：从表格行提取平台和架构
            const parsePlatformArch = (row) => {
              const rowRegex = /\|\s*(\w+)\s*\|\s*([\w_]+)\s*\|/;
              const m = row.match(rowRegex);
              return m ? [m[1].trim(), m[2].trim()] : [null, null];
            };

            // 辅助函数：统一平台名称（用于文件名匹配）
            const normalizePlatform = (platform) => {
              const p = platform.toLowerCase();
              if (p === 'macos') return 'macOS';
              if (p === 'windows') return 'Windows';
              if (p === 'linux') return 'Linux';
              return platform;
            };

            // 辅助函数：在 assets 中查找匹配的文件名
            const findMatchingAsset = (platform, arch) => {
              const archVariants = [arch];
              if (arch === 'x86_64') archVariants.push('x64');
              if (arch === 'arm64') archVariants.push('arm64');
              if (arch === 'x86') archVariants.push('x86');

              const normPlatform = normalizePlatform(platform);
              const basePattern = `Classin_DL-${version}-`;

              for (const asset of assets) {
                const name = asset.name;
                if (!name.startsWith(basePattern)) continue;
                const suffix = name.slice(basePattern.length);
                const parts = suffix.split('-', 2);
                if (parts.length < 2) continue;
                const assetPlatform = parts[0];
                const assetArch = parts[1].split('.')[0]; // 去掉扩展名
                if (assetPlatform.toLowerCase() === normPlatform.toLowerCase() &&
                    archVariants.some(a => a.toLowerCase() === assetArch.toLowerCase())) {
                  return name;
                }
              }
              return null;
            };

            // 逐行处理表格
            for (const line of lines) {
              if (line.startsWith('|') && !line.startsWith('|:') && !line.startsWith('| 平台 |')) {
                const [platform, arch] = parsePlatformArch(line);
                if (platform && arch) {
                  const filename = findMatchingAsset(platform, arch);
                  if (filename) {
                    const newGithub = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${version}/${filename}`;
                    const newCdn = `https://gh-proxy.org/${newGithub}`;

                    // 替换 GitHub 直链和 CDN 镜像链接
                    let newLine = line.replace(
                      /(\[GitHub 直链\]\()(https:\/\/github\.com\/[^)]+)(\))/,
                      `$1${newGithub}$3`
                    );
                    newLine = newLine.replace(
                      /(\[CDN 镜像\]\()(https:\/\/gh-proxy\.org\/[^)]+)(\))/,
                      `$1${newCdn}$3`
                    );
                    newLines.push(newLine);
                    console.log(`✅ 更新: ${platform} ${arch} → ${filename}`);
                  } else {
                    console.log(`⚠️ 未找到匹配文件: ${platform} ${arch}，保留原链接`);
                    newLines.push(line);
                  }
                } else {
                  newLines.push(line);
                }
              } else {
                newLines.push(line);
              }
            }

            const newTable = newLines.join('\n');
            const newContent = content.replace(oldTable, newTable);

            if (newContent !== content) {
              fs.writeFileSync(readmePath, newContent, 'utf8');
              console.log('README.md 已更新');

              // 提交更改
              await exec.exec('git', ['config', '--local', 'user.email', 'action@github.com']);
              await exec.exec('git', ['config', '--local', 'user.name', 'GitHub Action']);
              await exec.exec('git', ['add', 'README.md']);
              try {
                await exec.exec('git', ['diff-index', '--quiet', 'HEAD']);
              } catch {
                await exec.exec('git', ['commit', '-m', 'Update download links to latest release']);
                await exec.exec('git', ['push']);
              }
            } else {
              console.log('README.md 无变化');
            }
