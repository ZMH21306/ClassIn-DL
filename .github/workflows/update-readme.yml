name: Update README with latest release links (每分钟检查)

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest release tag from GitHub API
        id: latest
        run: |
          LATEST_TAG=$(curl -sL -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name')
          if [ "$LATEST_TAG" = "null" ] || [ -z "$LATEST_TAG" ]; then
            echo "tag=" >> $GITHUB_OUTPUT
          else
            echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Check if README already up-to-date
        id: check
        run: |
          LATEST_TAG="${{ steps.latest.outputs.tag }}"
          [ -z "$LATEST_TAG" ] && { echo "updated=false" >> $GITHUB_OUTPUT; exit 0; }
          LAST_TAG=$(cat .latest_release 2>/dev/null || echo "")
          if [ "$LATEST_TAG" = "$LAST_TAG" ]; then
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "new_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Extract version from tag
        if: steps.check.outputs.updated == 'true'
        id: vars
        run: |
          FULL_TAG="${{ steps.check.outputs.new_tag }}"
          VERSION="${FULL_TAG%-*}"
          echo "FULL_TAG=$FULL_TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # ===== 新增的通用替换步骤 =====
      - name: Update download links in README
        if: steps.check.outputs.updated == 'true'
        run: |
          sed -i "s|/releases/download/.*/Classin_DL-.*-Windows-x64.exe|/releases/download/${{ steps.check.outputs.new_tag }}/Classin_DL-${{ steps.vars.outputs.VERSION }}-Windows-x64.exe|g" README.md
          sed -i "s|/releases/download/.*/Classin_DL-.*-Windows-arm64.exe|/releases/download/${{ steps.check.outputs.new_tag }}/Classin_DL-${{ steps.vars.outputs.VERSION }}-Windows-arm64.exe|g" README.md
          sed -i "s|/releases/download/.*/Classin_DL-.*-Linux-x64|/releases/download/${{ steps.check.outputs.new_tag }}/Classin_DL-${{ steps.vars.outputs.VERSION }}-Linux-x64|g" README.md
          sed -i "s|/releases/download/.*/Classin_DL-.*-Linux-arm64|/releases/download/${{ steps.check.outputs.new_tag }}/Classin_DL-${{ steps.vars.outputs.VERSION }}-Linux-arm64|g" README.md
          sed -i "s|/releases/download/.*/Classin_DL-.*-macOS-x64|/releases/download/${{ steps.check.outputs.new_tag }}/Classin_DL-${{ steps.vars.outputs.VERSION }}-macOS-x64|g" README.md
          sed -i "s|/releases/download/.*/Classin_DL-.*-macOS-arm64|/releases/download/${{ steps.check.outputs.new_tag }}/Classin_DL-${{ steps.vars.outputs.VERSION }}-macOS-arm64|g" README.md
      # =============================

      - name: Save latest tag to file
        if: steps.check.outputs.updated == 'true'
        run: |
          echo "${{ steps.check.outputs.new_tag }}" > .latest_release

      - name: Commit and push changes
        if: steps.check.outputs.updated == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md .latest_release
          git commit -m "Update download links to ${{ steps.check.outputs.new_tag }}"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push
